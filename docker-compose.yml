
services:

  # =====================================
  # MYSQL - DATABASE
  # =====================================

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?required}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}

    volumes:
      - inventory_mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - db_network

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql -h 127.0.0.1
          -u "$${MYSQL_USER}"
          "$${MYSQL_DATABASE}"
          -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

    security_opt:
      - no-new-privileges:true

  # =====================================
  # NODE.JS - INVENTORY APP
  # =====================================

  app:
    build:
      context: ./app
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER:?required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?required}
      DB_NAME: ${MYSQL_DATABASE:?required}
      SESSION_SECRET: ${SESSION_SECRET:?required}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      NODE_ENV: development

    ports:
      - "127.0.0.1:3008:3000"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - app_network
      - db_network

    security_opt:
      - no-new-privileges:true

  # =====================================
  # PHPMYADMIN
  # =====================================

  phpmyadmin:
    image: phpmyadmin:5.2.3
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "127.0.0.1:8088:80"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - db_network

    security_opt:
      - no-new-privileges:true

  # =====================================
  # NGINX - REVERSE PROXY + HTTPS
  # =====================================

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - app

    networks:
      - app_network

    security_opt:
      - no-new-privileges:true

# =====================================
# DOCKER NETWORKS HIEN CO
# =====================================

networks:

  app_network:
    external: true
    name: inventory-management_app_network

  db_network:
    external: true
    name: inventory-management_db_network

# =====================================
# GIU NGUYEN MYSQL DATA VOLUME
# =====================================

volumes:

  inventory_mysql_data:
    name: inventory-management_inventory_mysql_data
