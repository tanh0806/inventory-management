services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?required}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    volumes:
      - inventory_mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - db_network
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  app:
    build: ./app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    ports:
      - "127.0.0.1:3008:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network
      - db_network

  phpmyadmin:
    image: phpmyadmin:5.2.3
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - db_network

networks:
  app_network:
  db_network:
    internal: true

volumes:
  inventory_mysql_data:
