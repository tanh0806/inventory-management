
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus tu giam sat
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # CPU, RAM, disk, network cua Ubuntu
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  # Giam sat HTTPS thuc te cua Inventory
  - job_name: inventory-https
    metrics_path: /probe

    params:
      module:
        - https_inventory

    static_configs:
      - targets:
          - https://nginx/health

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target

      - source_labels:
          - __param_target
        target_label: instance

      - target_label: __address__
        replacement: blackbox:9115
